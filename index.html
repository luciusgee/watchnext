<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<!-- No maximum-scale / user-scalable=no: suppressing zoom is an accessibility
     failure and an App Store review flag.

     No viewport-fit=cover either, which is the less obvious call. Asking for the
     whole screen is the modern answer and on iOS 26 it is how you get a viewport
     59pt shorter than the screen with nothing painted in the gap. Staying inside
     the safe area is the older behaviour — the viewport IS the safe area, the
     insets all report 0, and WebKit fills the outside with the page background,
     so the app reads as edge to edge without ever being handed those pixels.
     Tested on the device; this one looks right and cover does not. It was a
     setting for a while, and did not need to be. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0a09">
<meta name="description" content="Decide what to watch tonight from the films you already own.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Watch Next">
<title>Watch Next</title>

<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icon-192.png" type="image/png" sizes="192x192">
<!-- PNG, not the SVG. iOS does not reliably accept an SVG apple-touch-icon and
     silently falls back to a screenshot of the page — which, for an app whose
     only delivery channel is Add to Home Screen, is the first impression. -->
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
<!-- Launch images. Without these iOS shows a blank white field while the
     app boots, which on a dark app reads as a flash. There is no scaling
     fallback: a device size with no exact match gets the blank, so the
     list covers every iPhone that can install this, portrait only (the
     manifest locks orientation). Generated by tools/make-art.js. -->
<link rel="apple-touch-startup-image" media="(device-width:375px) and (device-height:667px) and (-webkit-device-pixel-ratio:2) and (orientation:portrait)" href="assets/splash/iphone-se.png">
<link rel="apple-touch-startup-image" media="(device-width:414px) and (device-height:736px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" href="assets/splash/iphone-8-plus.png">
<link rel="apple-touch-startup-image" media="(device-width:375px) and (device-height:812px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" href="assets/splash/iphone-x.png">
<link rel="apple-touch-startup-image" media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:2) and (orientation:portrait)" href="assets/splash/iphone-xr.png">
<link rel="apple-touch-startup-image" media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" href="assets/splash/iphone-xs-max.png">
<link rel="apple-touch-startup-image" media="(device-width:390px) and (device-height:844px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" href="assets/splash/iphone-12.png">
<link rel="apple-touch-startup-image" media="(device-width:428px) and (device-height:926px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" href="assets/splash/iphone-12-pro-max.png">
<link rel="apple-touch-startup-image" media="(device-width:393px) and (device-height:852px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" href="assets/splash/iphone-15.png">
<link rel="apple-touch-startup-image" media="(device-width:430px) and (device-height:932px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" href="assets/splash/iphone-15-pro-max.png">
<link rel="apple-touch-startup-image" media="(device-width:402px) and (device-height:874px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" href="assets/splash/iphone-16-pro.png">
<link rel="apple-touch-startup-image" media="(device-width:440px) and (device-height:956px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" href="assets/splash/iphone-16-pro-max.png">
<link rel="apple-touch-startup-image" media="(device-width:420px) and (device-height:912px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" href="assets/splash/iphone-air.png">
<link rel="manifest" href="app.webmanifest">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>
<!-- boot:start -->
<div id="boot" aria-hidden="true"><div class="boot-glow"></div><svg class="boot-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect x="57.0" y="371.0" width="398.0" height="14.0" rx="7.0" fill="#4a423a"/><rect x="77.0" y="170.0" width="70.0" height="196.0" rx="15.0" fill="#4c453d"/><rect x="173.0" y="170.0" width="70.0" height="196.0" rx="15.0" fill="#5e564c"/><rect x="269.0" y="98.0" width="70.0" height="196.0" rx="15.0" fill="#e8a33d"/><rect x="365.0" y="170.0" width="70.0" height="196.0" rx="15.0" fill="#5e564c"/></svg><div class="boot-word">Watch<i>.</i>Next</div></div>
<!-- boot:end -->

<div id="app">

  <!-- ─────────────  TONIGHT  ───────────── -->
  <main id="screen-tonight" class="screen is-active" aria-label="Tonight">
    <header class="topbar">
      <button class="iconbtn" type="button" data-nav="settings" data-icon="settings" aria-label="Settings"></button>
      <h1 class="wordmark">Watch<span>.</span>Next</h1>
      <button class="iconbtn" type="button" data-nav="add" data-icon="plus" aria-label="Add titles"></button>
    </header>
    <div class="scroll">
      <div data-region="body"></div>
    </div>
  </main>

  <!-- ─────────────  DISCOVER  ───────────── -->
  <main id="screen-discover" class="screen" aria-label="Discover">
    <header class="topbar">
      <span class="iconbtn" aria-hidden="true"></span>
      <h1 class="topbar-title">Discover</h1>
      <span class="iconbtn" aria-hidden="true"></span>
    </header>

    <div class="deck-progress" data-region="progress" hidden>
      <div class="deck-progress-bar" role="progressbar" aria-label="Sorted" aria-valuemin="0" data-region="meter"><div class="deck-progress-fill" data-region="bar" style="width:0%"></div></div>
      <p class="deck-progress-text">
        <span data-region="done"></span>
        <span data-region="left"></span>
      </p>
    </div>

    <div class="deck" data-region="deck"></div>

    <div class="deck-controls" data-region="controls" hidden>
      <!-- Captioned, in the words the stamps and toasts use. An unlabelled ✕
           read to a first-time user as "remove from library". -->
      <div class="deck-choice">
        <button class="deck-btn" type="button" data-haptic data-action="skip" data-icon="close" data-icon-size="24" aria-label="Not yet"></button>
        <span class="deck-btn-label" aria-hidden="true">Not yet</span>
      </div>
      <div class="deck-choice">
        <button class="deck-btn deck-btn-yes" type="button" data-haptic data-action="watched" data-icon="check" data-icon-size="24" aria-label="Seen it"></button>
        <span class="deck-btn-label" aria-hidden="true">Seen it</span>
      </div>
    </div>
  </main>

  <!-- ─────────────  TONIGHT'S SHORTLIST  ───────────── -->
  <main id="screen-pick" class="screen" aria-label="Tonight's shortlist">
    <header class="topbar">
      <button class="iconbtn" type="button" data-nav="back" data-icon="back" aria-label="Back"></button>
      <h1 class="topbar-title">Pick one</h1>
      <button class="iconbtn" type="button" data-action="constraints" data-icon="sliders" aria-label="Change what you fancy"></button>
    </header>

    <p class="pick-meta" data-region="meta" aria-live="polite"></p>

    <div class="deck" data-region="deck"></div>

    <div class="deck-controls is-idle" data-region="controls">
      <div class="deck-choice">
        <button class="deck-btn" type="button" data-haptic data-action="no" data-icon="close" data-icon-size="24" aria-label="Not tonight"></button>
        <span class="deck-btn-label" aria-hidden="true">Not tonight</span>
      </div>
      <div class="deck-choice">
        <button class="deck-btn deck-btn-yes" type="button" data-haptic data-action="yes" data-icon="playFill" data-icon-size="22" aria-label="That one"></button>
        <span class="deck-btn-label" aria-hidden="true">That one</span>
      </div>
    </div>
  </main>

  <!-- ─────────────  LIBRARY  ───────────── -->
  <main id="screen-library" class="screen" aria-label="Library">
    <header class="topbar">
      <button class="iconbtn" type="button" data-action="sort" data-icon="sort" aria-label="Sort"></button>
      <h1 class="topbar-title">Library</h1>
      <button class="iconbtn" type="button" data-haptic data-action="view" aria-label="Change view"></button>
    </header>

    <div class="searchbar">
      <span data-icon="search" data-icon-size="18"></span>
      <input id="library-search" type="search" enterkeyhint="search" placeholder="Search your library" aria-label="Search your library" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>

    <div style="display:flex;align-items:center;gap:12px;padding:0 16px 12px;flex:none">
      <button class="pill" type="button" data-action="filter" style="display:inline-flex;align-items:center;gap:6px">
        <span data-icon="filter" data-icon-size="15"></span>
        <span>Filter</span>
        <span data-region="filter-count" style="background:var(--amber);color:var(--ink);border-radius:9px;min-width:18px;height:18px;display:inline-grid;place-items:center;font-size:11px;padding:0 5px"></span>
      </button>
      <span data-region="count" style="font-size:12px;color:var(--ash);margin-left:auto"></span>
    </div>

    <div class="scroll">
      <div data-region="list" class="lib-list"></div>
      <div data-region="sentinel" style="height:1px"></div>
    </div>
  </main>

  <!-- ─────────────  ASK  ───────────── -->
  <main id="screen-ask" class="screen" aria-label="Ask">
    <header class="topbar">
      <!-- Top-left, where Tonight keeps it. On the right it sat where Tonight
           keeps "Add titles", and the thumb went to the wrong corner. -->
      <button class="iconbtn" type="button" data-nav="settings" data-icon="settings" aria-label="Settings"></button>
      <h1 class="topbar-title">Ask</h1>
      <span class="iconbtn" aria-hidden="true"></span>
    </header>

    <div class="chat" data-region="thread" role="log" aria-live="polite" aria-label="Conversation"></div>

    <div class="suggestions" data-region="constraints"></div>

    <form class="composer" data-region="composer">
      <label class="sr-only" for="ask-input">What are you in the mood for?</label>
      <textarea id="ask-input" rows="1" enterkeyhint="send" autocapitalize="sentences" placeholder="Tense, but not too long…"></textarea>
      <button class="send" type="submit" data-action="send" data-icon="send" data-icon-size="20" aria-label="Send" disabled></button>
    </form>
  </main>

  <!-- ─────────────  A SHARED SHELF  ───────────── -->
  <main id="screen-shelf" class="screen" aria-label="A shared shelf">
    <header class="topbar">
      <span class="iconbtn" aria-hidden="true"></span>
      <h1 class="wordmark">Watch<span>.</span>Next</h1>
      <span class="iconbtn" aria-hidden="true"></span>
    </header>
    <div class="scroll">
      <div data-region="body"></div>
    </div>
  </main>

  <!-- ─────────────  STATS  ───────────── -->
  <main id="screen-stats" class="screen" aria-label="Your shelf, counted">
    <header class="topbar">
      <button class="iconbtn" type="button" data-nav="back" data-icon="back" aria-label="Back"></button>
      <h1 class="topbar-title">Your shelf</h1>
      <span class="iconbtn" aria-hidden="true"></span>
    </header>
    <div class="scroll">
      <div data-region="body"></div>
    </div>
  </main>

  <!-- ─────────────  ADD  ───────────── -->
  <main id="screen-add" class="screen" aria-label="Add titles">
    <header class="topbar">
      <button class="iconbtn" type="button" data-nav="back" data-icon="back" aria-label="Back"></button>
      <h1 class="topbar-title">Add titles</h1>
      <span class="iconbtn" aria-hidden="true"></span>
    </header>
    <div class="scroll">
      <div data-region="body"></div>
    </div>
  </main>

  <!-- ─────────────  SETTINGS  ───────────── -->
  <main id="screen-settings" class="screen" aria-label="Settings">
    <header class="topbar">
      <button class="iconbtn" type="button" data-nav="back" data-icon="back" aria-label="Back"></button>
      <h1 class="topbar-title">Settings</h1>
      <span class="iconbtn" aria-hidden="true"></span>
    </header>
    <div class="scroll">
      <div data-region="body"></div>
    </div>
  </main>

</div>

<!-- ─────────────  DETAIL OVERLAY  ───────────── -->
<div id="detail-under" class="detail-under" aria-hidden="true"></div>
<div id="detail" class="detail" role="dialog" aria-modal="true" aria-labelledby="detail-title" tabindex="-1" aria-hidden="true"></div>

<script type="module" src="src/main.js"></script>
<noscript>
  <p style="padding:40px 20px;text-align:center;color:#b0a9a1">Watch Next needs JavaScript to run.</p>
</noscript>
</body>
</html>
