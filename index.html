<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<!-- No maximum-scale / user-scalable=no: suppressing zoom is an accessibility
     failure and an App Store review flag. viewport-fit=cover so the safe-area
     insets actually resolve on notched devices. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  /* Screen fit has to be settled before the first layout. Rewriting this meta
     after load does not make iOS recompute the viewport — it reports the same
     numbers as before and the setting does nothing. Hence an inline script in
     the head, ahead of the stylesheet, and its own tiny key so this does not
     have to parse the whole saved state on the critical path. */
  try {
    var fit = localStorage.getItem('wn.fit');

    /* The setting predates that key: it used to live in the app's saved state,
       where nothing reads it this early. Carry it over once, or the first
       launch after updating comes up on the wrong fit and the only way out is
       toggling the switch twice. Parsing the whole library here is not cheap,
       so a marker makes sure it happens at most once per device — after that
       the fast path above is a single small read. Key spelled out rather than
       imported because nothing is loaded yet; if it ever changes this becomes
       dead code, which by then is the correct outcome. */
    if (!fit && !localStorage.getItem('wn.fit.checked')) {
      var raw = localStorage.getItem('wn.state.v3');
      var was = raw ? (JSON.parse(raw).settings || {}).screenFit : null;
      if (was === 'safe' || was === 'cover') {
        localStorage.setItem('wn.fit', was);
        fit = was;
      }
      localStorage.setItem('wn.fit.checked', '1');
    }

    if (fit === 'safe') {
      document.currentScript.previousElementSibling.setAttribute(
        'content', 'width=device-width, initial-scale=1'
      );
    }
  } catch (e) { /* storage unavailable or unreadable: keep the default */ }
</script>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0a09">
<meta name="description" content="Decide what to watch tonight from the films you already own.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Watch Next">
<title>Watch Next</title>

<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon.svg">
<link rel="manifest" href="app.webmanifest">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>

<div id="app">

  <!-- ─────────────  TONIGHT  ───────────── -->
  <main id="screen-tonight" class="screen is-active" aria-label="Tonight">
    <header class="topbar">
      <button class="iconbtn" type="button" data-nav="settings" data-icon="settings" aria-label="Settings"></button>
      <span class="wordmark">Watch<span>.</span>Next</span>
      <button class="iconbtn" type="button" data-nav="add" data-icon="plus" aria-label="Add titles"></button>
    </header>
    <div class="scroll">
      <div data-region="body"></div>
    </div>
  </main>

  <!-- ─────────────  DISCOVER  ───────────── -->
  <main id="screen-discover" class="screen" aria-label="Discover">
    <header class="topbar">
      <span class="iconbtn" aria-hidden="true"></span>
      <h1 class="topbar-title">Discover</h1>
      <span class="iconbtn" aria-hidden="true"></span>
    </header>

    <div class="deck-progress" data-region="progress" hidden>
      <div class="deck-progress-bar"><div class="deck-progress-fill" data-region="bar" style="width:0%"></div></div>
      <p class="deck-progress-text">
        <span data-region="done"></span>
        <span data-region="left"></span>
      </p>
    </div>

    <div class="deck" data-region="deck"></div>

    <div class="deck-controls" data-region="controls" hidden>
      <button class="deck-btn" type="button" data-action="skip" data-icon="close" data-icon-size="24" aria-label="Skip this"></button>
      <button class="deck-btn deck-btn-save" type="button" data-action="save" data-icon="bookmark" data-icon-size="20" aria-label="Add to watchlist"></button>
      <button class="deck-btn deck-btn-yes" type="button" data-action="watched" data-icon="check" data-icon-size="24" aria-label="Already watched"></button>
    </div>
  </main>

  <!-- ─────────────  LIBRARY  ───────────── -->
  <main id="screen-library" class="screen" aria-label="Library">
    <header class="topbar">
      <button class="iconbtn" type="button" data-action="sort" data-icon="sliders" aria-label="Sort"></button>
      <h1 class="topbar-title">Library</h1>
      <button class="iconbtn" type="button" data-action="view" aria-label="Change view"></button>
    </header>

    <div class="searchbar">
      <span data-icon="search" data-icon-size="18"></span>
      <input id="library-search" type="search" placeholder="Search your library" aria-label="Search your library" autocomplete="off" spellcheck="false">
    </div>

    <div style="display:flex;align-items:center;gap:12px;padding:0 16px 12px;flex:none">
      <button class="pill" type="button" data-action="filter" style="display:inline-flex;align-items:center;gap:6px">
        <span data-icon="filter" data-icon-size="15"></span>
        <span>Filter</span>
        <span data-region="filter-count" style="background:var(--amber);color:var(--ink);border-radius:9px;min-width:18px;height:18px;display:inline-grid;place-items:center;font-size:11px;padding:0 5px"></span>
      </button>
      <span data-region="count" style="font-size:12px;color:var(--ash);margin-left:auto"></span>
    </div>

    <div class="scroll">
      <div data-region="list" class="lib-list"></div>
      <div data-region="sentinel" style="height:1px"></div>
    </div>
  </main>

  <!-- ─────────────  ASK  ───────────── -->
  <main id="screen-ask" class="screen" aria-label="Ask">
    <header class="topbar">
      <span class="iconbtn" aria-hidden="true"></span>
      <h1 class="topbar-title">Ask</h1>
      <button class="iconbtn" type="button" data-nav="settings" data-icon="settings" aria-label="Settings"></button>
    </header>

    <div class="chat" data-region="thread" role="log" aria-live="polite" aria-label="Conversation"></div>

    <div class="suggestions" data-region="constraints"></div>

    <form class="composer" data-region="composer">
      <label class="sr-only" for="ask-input">What are you in the mood for?</label>
      <textarea id="ask-input" rows="1" placeholder="Something tense but not too long…"></textarea>
      <button class="send" type="submit" data-action="send" data-icon="send" data-icon-size="20" aria-label="Send" disabled></button>
    </form>
  </main>

  <!-- ─────────────  ADD  ───────────── -->
  <main id="screen-add" class="screen" aria-label="Add titles">
    <header class="topbar">
      <button class="iconbtn" type="button" data-nav="tonight" data-icon="back" aria-label="Back"></button>
      <h1 class="topbar-title">Add titles</h1>
      <span class="iconbtn" aria-hidden="true"></span>
    </header>
    <div class="scroll">
      <div data-region="body"></div>
    </div>
  </main>

  <!-- ─────────────  SETTINGS  ───────────── -->
  <main id="screen-settings" class="screen" aria-label="Settings">
    <header class="topbar">
      <button class="iconbtn" type="button" data-nav="tonight" data-icon="back" aria-label="Back"></button>
      <h1 class="topbar-title">Settings</h1>
      <span class="iconbtn" aria-hidden="true"></span>
    </header>
    <div class="scroll">
      <div data-region="body"></div>
    </div>
  </main>

</div>

<!-- ─────────────  DETAIL OVERLAY  ───────────── -->
<div id="detail" class="detail" role="dialog" aria-modal="true" aria-label="Title details" aria-hidden="true"></div>

<script type="module" src="src/main.js"></script>
<noscript>
  <p style="padding:40px 20px;text-align:center;color:#b0a9a1">Watch Next needs JavaScript to run.</p>
</noscript>
</body>
</html>
